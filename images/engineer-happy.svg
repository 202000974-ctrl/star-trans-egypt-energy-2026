<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-label="Happy Star Trans engineer in a lab coat">
  <defs>
    <linearGradient id="coatG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4ebf8"/>
    </linearGradient>
    <linearGradient id="badgeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35c8f5"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="skinG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d3b4"/>
      <stop offset="1" stop-color="#eab993"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="200" cy="456" rx="112" ry="15" fill="#1f6feb" opacity="0.12"/>

  <!-- legs -->
  <rect x="162" y="322" width="36" height="118" rx="14" fill="#1b2b4d"/>
  <rect x="202" y="322" width="36" height="118" rx="14" fill="#16233f"/>

  <!-- shoes -->
  <rect x="150" y="428" width="54" height="24" rx="12" fill="#0f1c33"/>
  <rect x="196" y="428" width="54" height="24" rx="12" fill="#0f1c33"/>

  <!-- lab coat -->
  <path d="M142 206 Q200 188 258 206 L288 352 Q200 372 112 352 Z" fill="url(#coatG)" stroke="#d2dcee" stroke-width="2"/>

  <!-- shirt -->
  <path d="M174 200 L200 258 L226 200 Z" fill="#1f6feb"/>

  <!-- collar -->
  <path d="M170 196 L200 260 L180 200 Z" fill="#ffffff" stroke="#d2dcee" stroke-width="1.5"/>
  <path d="M230 196 L200 260 L220 200 Z" fill="#ffffff" stroke="#d2dcee" stroke-width="1.5"/>

  <!-- pocket -->
  <rect x="228" y="272" width="46" height="36" rx="7" fill="none" stroke="#d2dcee" stroke-width="2"/>

  <!-- Star Trans badge -->
  <rect x="136" y="252" width="62" height="30" rx="9" fill="url(#badgeG)"/>
  <path d="M152 258 l-8 13 h8 l-3 11 12 -15 h-8 z" fill="#ffffff"/>
  <text x="170" y="266" font-family="Inter, Arial, Helvetica, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">STAR</text>
  <text x="170" y="275" font-family="Inter, Arial, Helvetica, sans-serif" font-size="7.5" font-weight="600" fill="#d5ebff">TRANS</text>

  <!-- left arm (down) -->
  <rect x="112" y="210" width="36" height="118" rx="18" fill="url(#coatG)" stroke="#d2dcee" stroke-width="2" transform="rotate(12 130 212)"/>
  <circle cx="106" cy="326" r="18" fill="url(#skinG)"/>

  <!-- right arm (raised, waving) -->
  <rect x="248" y="198" width="36" height="118" rx="18" fill="url(#coatG)" stroke="#d2dcee" stroke-width="2" transform="rotate(-130 266 200)"/>
  <circle cx="355" cy="125" r="19" fill="url(#skinG)"/>

  <!-- neck -->
  <rect x="184" y="160" width="32" height="42" rx="12" fill="#e8b892"/>

  <!-- head -->
  <ellipse cx="200" cy="126" rx="63" ry="69" fill="url(#skinG)"/>
  <circle cx="137" cy="130" r="14" fill="#eab993"/>
  <circle cx="263" cy="130" r="14" fill="#eab993"/>

  <!-- hair -->
  <path d="M136 122 Q132 58 200 54 Q268 58 264 122 Q252 92 200 88 Q148 92 136 122 Z" fill="#2b3a55"/>

  <!-- cheeks -->
  <circle cx="164" cy="146" r="11" fill="#f08a7a" opacity="0.35"/>
  <circle cx="236" cy="146" r="11" fill="#f08a7a" opacity="0.35"/>

  <!-- happy eyes -->
  <path d="M168 122 q11 -13 22 0" fill="none" stroke="#243b5e" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M210 122 q11 -13 22 0" fill="none" stroke="#243b5e" stroke-width="5.5" stroke-linecap="round"/>

  <!-- big smile -->
  <path d="M174 148 q26 30 52 0" fill="none" stroke="#243b5e" stroke-width="6" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M330 54 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 z" fill="#35c8f5"/>
  <path d="M62 92 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" fill="#1f6feb" opacity="0.7"/>
  <path d="M352 176 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" fill="#e8b962"/>
</svg>
